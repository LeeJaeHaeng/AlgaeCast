[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algaecast"
version = "0.1.0"
description = "AlgaeCast-7: 수질·수문·기상 융합 기반 유해남조류 7일 예측"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = "notebooks|web|data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
