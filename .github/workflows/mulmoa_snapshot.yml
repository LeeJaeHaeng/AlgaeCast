# 물모아 'AI 녹조 정밀 예측 정보' 스냅샷 — WQ-04 벤치마크 원자료 (T8 daily.yml 과 별도 유지) + 기상 예보 발표분(MT-05/06) 누적
# 매일 KST 06:00 / 09:00 / 18:00 (UTC 21,0,9시). 같은 날 동일 내용이면 커밋 없음. 어떤 단계가 실패해도 워크플로는 성공으로 끝난다.
name: mulmoa-snapshot

on:
  schedule:
    - cron: "0 21,0,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mulmoa-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal deps
        continue-on-error: true
        run: |
          pip install requests urllib3 pyyaml python-dotenv numpy pandas pandera pyarrow
          pip install -e . --no-deps

      - name: Snapshot
        id: snap
        continue-on-error: true
        run: |
          mkdir -p logs
          python scripts/snapshot_mulmoa_forecast.py 2>&1 | tee -a logs/mulmoa_snapshot.log

      - name: KMA forecast snapshot (단기예보 05시 발표분 + 중기예보 06시, T1-e)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          API_KMA_VILAGE_FCST: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
          API_KMA_MID_FCST: https://apis.data.go.kr/1360000/MidFcstInfoService
        run: python -m algaecast.collect.kma_forecast 2>&1 | tee -a logs/mulmoa_snapshot.log

      - name: Live benchmark (Mulmoa forecast vs NIER observations)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/update_live_benchmark.py 2>&1 | tee -a logs/mulmoa_snapshot.log

      - name: Commit & push (only if a new CSV appeared)
        continue-on-error: true
        env:
          TZ: Asia/Seoul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/mulmoa/*.csv data/raw/kma_forecast/*.csv reports/eval/live_benchmark.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new snapshot to commit"; exit 0
          fi
          git commit -m "data(mulmoa): snapshot $(date +'%Y-%m-%d %H:%M KST') [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mulmoa-snapshot-log-${{ github.run_id }}
          path: logs/mulmoa_snapshot.log
          if-no-files-found: ignore
          retention-days: 14
