# AlgaeCast-7 대상 지점·연계 시설 정의 (T0-b, 2026-10-20)
# 출처: 대회 stations.csv / 03_collect_dataset.py (2026-09-12), K-water 댐코드 조회 API(2026-10-20 실응답),
#       WAMIS 개방 API(mn_dammain, wl_dubwlobs, 보 목록), KMA 수문기상 댐정보, K-water·부산시·창원시·대구시·청주시 공식 페이지.
#       항목별 출처 URL·인용문은 docs/reference/sites_facts_verified.json (검증 통과 229건).
# TODO 로 표시된 값은 1차 출처 확인 전이다. 추정값을 넣지 않는다.
version: "2026-10-20"

alert_thresholds_cells_per_ml: # 상수원 구간, 2회 연속 측정 기준 (조류경보제 운영 매뉴얼 2025.8 / 물환경보전법 시행령 별표3)
  caution: 1000 # 관심
  warning: 10000 # 경계 (또는 조류독소 10 μg/L 이상)
  outbreak: 1000000 # 조류대발생
  release_below: 1000 # 해제
harmful_genera: [Microcystis, Anabaena, Aphanizomenon, Oscillatoria] # 유해남조류 4속 (세포수 합)

