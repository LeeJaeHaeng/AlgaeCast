  fc_pop_mean_d1_7: 예보 피처 — 2026-10-21 이후만 가용, 전 샘플 결측 → 선별 제외, 후속 재검토(T8 이후)
  fc_rain_days: 예보 피처 — 2026-10-21 이후만 가용, 전 샘플 결측 → 선별 제외, 후속 재검토(T8 이후)
